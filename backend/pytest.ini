[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
; 用例与 fixture 必须共用同一个事件循环：SQLAlchemy 的连接池在某个循环里建连接，
; 换个循环再用就会报「got Future attached to a different loop」。
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = -ra --strict-markers
markers =
    concurrency: 并发/行锁用例，依赖真 PostgreSQL，串行执行
    e2e: 需要浏览器交互的端到端用例
