services:
  postgres:
    image: postgres:16-alpine
    container_name: zxs-postgres
    environment:
      POSTGRES_USER: zxs
      POSTGRES_PASSWORD: zxs_dev_pw
      POSTGRES_DB: zhuxiaoshang
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zxs -d zhuxiaoshang"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: zxs-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
